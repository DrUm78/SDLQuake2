// Default GCW Zero key bindings.
// Do not alter. (or do, if you wish different key settings)

// THIS GOES INTO A FOLDER NAMED baseq2 INSIDE THE OPK!

//A, B, X, Y
unbind SPACE 
unbind ALT 
unbind CTRL 
unbind SHIFT 

//UP, DOWN, LEFT RIGHT
bind UPARROW "inven"
bind DOWNARROW "invdrop"
bind LEFTARROW "invprev"
bind RIGHTARROW "invnext"

//LEFT SHOULDER, RIGHT SHOULDER
bind TAB "+moveup"
bind BACKSPACE "+attack"
bind PGUP "weapprev"
unbind PGDN
bind PGDN "weapnext"
bind KP_SLASH "duck"

//SELECT
bind ESCAPE "invuse"

//START
unbind ENTER

//OPTIONS
set s_volume "0.700000"
//set cd_nocd "0"
set cd_shuffle "0"
set s_loadas8bit "0"
set s_khz "22"
set sensitivity "3"
set cl_yawspeed "140"
set cl_pitchspeed "140"
set cl_run "1"
set m_pitch "0.022"
set lookspring "1"
set lookstrafe "0"
set freelook "0"
set crosshair "0"
set in_joystick "1"
//VIDEO
set vid_ref "softsdl"

//ALIASES
//Toggle CROUCHING
alias duck "d_duck"
alias d_duck "alias duck d_stand;+movedown"
alias d_stand "alias duck d_duck;-movedown"
